<!DOCTYPE html>
<html>
<head>
    <title>Auto-Refresh Test</title>
</head>
<body>
    <h1>Auto-Refresh Test</h1>
    <p>Open browser console (F12) and check for logs every 5 seconds</p>
    <p>Last refresh: <span id="lastRefresh">Never</span></p>
    <p>Refresh count: <span id="count">0</span></p>
    <button onclick="clearLogs()">Clear Console</button>
    
    <script>
        let count = 0;
        let intervalId = null;
        
        function performRefresh() {
            count++;
            const now = new Date().toLocaleTimeString();
            console.log(`[Test] Auto-refresh triggered at ${now} (count: ${count})`);
            document.getElementById('lastRefresh').textContent = now;
            document.getElementById('count').textContent = count;
        }
        
        function setupAutoRefresh() {
            console.log('[Test] Setting up auto-refresh with 5000ms interval');
            
            // Clear any existing interval
            if (intervalId) {
                clearInterval(intervalId);
            }
            
            // Set up new interval
            intervalId = setInterval(() => {
                console.log('[Test] Interval callback fired');
                performRefresh();
            }, 5000);
            
            console.log('[Test] Interval ID:', intervalId);
        }
        
        function clearLogs() {
            console.clear();
            console.log('[Test] Console cleared');
        }
        
        // Start on page load
        setupAutoRefresh();
        console.log('[Test] Page loaded, auto-refresh started');
    </script>
</body>
</html>
